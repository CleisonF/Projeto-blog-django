services:
  - type: web
    name: Braids-Bymoon
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && python djangoapp/manage.py collectstatic --no-input
    startCommand: gunicorn project.wsgi:application

    envVars:
      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: braidsbymoon-db
          property: connectionString

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: SECRET_KEY
        generateValue: true

databases:
  - name: braidsbymoon-db
    plan: free
    region: oregon
