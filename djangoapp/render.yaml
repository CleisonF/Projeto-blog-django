services:
  - type: web
    name: Braids-Bymoon
    env: python
    buildCommand: "pip install -r requirements.txt && python djangoapp/manage.py collectstatic --no-input"
    startCommand: "gunicorn djangoapp.wsgi:application --bind 0.0.0.0:8000"
    envVars:
      - key: DEBUG
        value: "False"

      # DATABASE_URL será preenchida automaticamente após criar o banco abaixo
      - key: DATABASE_URL
        fromDatabase:
          name: braidsbymoon-db
          property: connectionString

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Django secret
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: braidsbymoon-db
    plan: free
    region: oregon
